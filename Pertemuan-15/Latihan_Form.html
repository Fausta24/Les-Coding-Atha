<!DOCTYPE html>
<html>

<head>
    <title>Latihan Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <style>
        body {

            padding: 20px;
        }

        form div {
            margin-bottom: 10px;
        }

        .output {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #f21;
        }
    </style>

</head>

<body>
    <h2>HTML Input Demo With JavaScript</h2>
    <form id="demoForm">
        <div>
            <label for="text">Text</label>
            <input type="text" id="text" name="text">
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" />
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" />
        </div>
        <div>
            <label for="number">Number</label>
            <input type="number" id="number" name="number" />
        </div>
        <div>
            <label for="tell">Tell</label>
            <input type="tel" id="tell" name="tell" />
        </div>
        <div>
            <label for="date">Date</label>
            <input type="date" id="date" name="date" />
        </div>
        <div>
            <label for="url">URL</label>
            <input type="url" id="url" name="url" />
        </div>
        <div>
            <label for="datetime">Datetime</label>
            <input type="datetime-local" id="datetime" name="datetime" />
        </div>
        <div>
            <label for="gender">Gender</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>
        <div>
            <label for="hobi">Hobi</label>
            <label>
                <input type="checkbox" id="hobi1" name="hobi" value="membaca"> Membaca
            </label>
            <label>
                <input type="checkbox" id="hobi2" name="hobi" value="menulis"> Koding
            </label>
            <label>
                <input type="checkbox" id="hobi3" name="hobi" value="bermain"> Bermain Game
            </label>
        </div>
        <div>
            <label for="daftarnegara">Daftar Negara</label>
            <select id="daftarnegara" name="daftarnegara">
                <option value="">Pilih Negara Anda</option>
                <option value="indonesia">Indonesia</option>
                <option value="malaysia">Malaysia</option>
                <option value="singapura">Singapura</option>
            </select>
        </div>
        <div>
            <label for="pesan">Pesan</label>
            <textarea id="pesan" name="pesan"></textarea>
        </div>
        <div>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>
    </form>
    <div class="output" id="output">

    </div>
    <script>
        document.getElementById("demoForm").addEventListener("submit", function (event) {
            event.preventDefault();
            const formData = new FormData(this);
            let resultHTML = "<h3>Form Data:</h3><ul> ";
            for (let [key, value] of formData.entries()) {
                resultHTML += `<li><strong>${key}:</strong>: ${value}</li>`;
            }
            const checkboxses = document.querySelectorAll("input[name='hobi']:checked");
            if (checkboxses.length > 0) {
                let hobies = [];
                checkboxses.forEach(checkbox=>hobies.push(checkbox.value));
                resultHTML += `<li><strong>Hobi(all)</strong>: ${hobies.join(", ")}</li>`;
            }
            resultHTML += "</ul>";
            document.getElementById("output").innerHTML = resultHTML;
        })
    </script>
</body>

</html>
